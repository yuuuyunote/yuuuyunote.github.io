<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>note記事検索 — ゆううゆ Portfolio</title>
  <meta name="description" content="ゆううゆのnote記事(全件)をキーワードで検索できる特設ページです。" />
  <link rel="icon" type="image/png" href="images/profileicon" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="ホームへ">
        <span class="brand-mark"><img src="images/profileicon" alt="" width="34" height="34" /></span>
        <span>ゆううゆ</span>
      </a>
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="グローバルナビゲーション">
        <a href="index.html">ホーム</a>
        <a href="works.html">実績</a>
        <a href="services.html">依頼できる内容</a>
        <a href="contact.html">コンタクト</a>
        <a href="search.html" aria-current="page">note検索</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-hero">
        <p class="eyebrow">Archive</p>
        <h1 class="page-title">note記事検索</h1>
        <p class="page-desc">これまで投稿したnote記事をタイトルで検索できます。表記の揺れにはある程度対応していますが、入力ミスには厳しめです。</p>
      </div>
    </div>

    <div class="container page-body">
      <div class="search-wrap">

        <div class="search-box card">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input type="text" id="search-input" class="search-input" placeholder="記事タイトルで検索（例：Bot設定 / セキュリティ）" autocomplete="off" aria-label="記事タイトルで検索" />
          <button type="button" id="search-clear" class="search-clear" aria-label="検索をクリア">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>

        <div class="filter-row" role="group" aria-label="記事の絞り込み">
          <button type="button" class="filter-chip active" data-filter="all">すべて</button>
          <button type="button" class="filter-chip" data-filter="free">無料記事</button>
          <button type="button" class="filter-chip" data-filter="premium"><i class="fa-solid fa-crown" aria-hidden="true"></i> 有料記事</button>
        </div>

        <p id="search-count" class="search-count" aria-live="polite"></p>

        <div id="search-results" class="note-list">
          <p class="note-status">記事を読み込み中...</p>
        </div>

      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner container">
      <p class="footer-copy">© 2026 ゆううゆ. All rights reserved.</p>
      <nav class="footer-links" aria-label="フッターナビゲーション">
        <a href="index.html">ホーム</a>
        <a href="works.html">実績</a>
        <a href="services.html">依頼できる内容</a>
        <a href="contact.html">コンタクト</a>
        <a href="search.html">note検索</a>
      </nav>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
  <script>
    (function () {
      var input = document.getElementById('search-input');
      var clearBtn = document.getElementById('search-clear');
      var resultsEl = document.getElementById('search-results');
      var countEl = document.getElementById('search-count');
      var filterChips = document.querySelectorAll('.filter-chip');

      var articles = [];
      var fuse = null;
      var currentFilter = 'all'; // 'all' | 'free' | 'premium'

      // 表記揺れ対応の同義語グループ。
      // Fuse.js のしきい値だけでは「ディスコード」と「Discord」のような別表記は拾えないため、
      // 検索語をグループ内の別表記に置き換えたバリエーションも合わせて検索する。
      var SYNONYM_GROUPS = [
        ['discord', 'ディスコード'],
        ['bot', 'ボット'],
        ['スマホ', 'スマートフォン'],
        ['サーバー', '鯖'],
        ['なりすまし', '偽アカウント'],
        ['絵文字', 'emoji', 'スタンプ'],
        ['荒らし', 'レイド']
      ];

      function escapeRegExp(s) {
        return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }

      function expandQuery(query) {
        var lower = query.toLowerCase();
        var variants = new Set([query]);
        SYNONYM_GROUPS.forEach(function (group) {
          group.forEach(function (term) {
            if (lower.indexOf(term.toLowerCase()) === -1) return;
            group.forEach(function (alt) {
              if (alt === term) return;
              variants.add(query.replace(new RegExp(escapeRegExp(term), 'ig'), alt));
            });
          });
        });
        return Array.from(variants);
      }

      function esc(str) {
        return String(str)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function formatDate(dateStr) {
        var d = new Date(dateStr);
        if (isNaN(d)) return '';
        return d.getFullYear() + '.' +
               String(d.getMonth() + 1).padStart(2, '0') + '.' +
               String(d.getDate()).padStart(2, '0');
      }

      function renderResults(items) {
        if (!items.length) {
          resultsEl.innerHTML =
            '<div class="search-empty"><i class="fa-regular fa-face-frown" aria-hidden="true"></i>' +
            '一致する記事が見つかりませんでした。</div>';
          return;
        }
        resultsEl.innerHTML = items.map(function (item) {
          var isPremium = !!item.premium;
          var badge = isPremium
            ? '<span class="note-item-badge"><i class="fa-solid fa-crown" aria-hidden="true"></i>有料</span>'
            : '';
          return '<a href="' + esc(item.url) + '" class="note-item' + (isPremium ? ' note-item--premium' : '') + '" target="_blank" rel="noopener">' +
            '<div class="note-item-icon" aria-hidden="true"><i class="fa-solid ' + (isPremium ? 'fa-crown' : 'fa-pen-nib') + '"></i></div>' +
            '<div class="note-item-body">' +
              '<div class="note-item-title-row">' +
                '<p class="note-item-title">' + esc(item.title) + '</p>' + badge +
              '</div>' +
              '<p class="note-item-meta">' + formatDate(item.pubDate) + '</p>' +
            '</div>' +
            '<i class="fa-solid fa-arrow-right note-item-arrow" aria-hidden="true"></i>' +
          '</a>';
        }).join('');
      }

      function applyFilter(list) {
        if (currentFilter === 'premium') return list.filter(function (a) { return !!a.premium; });
        if (currentFilter === 'free') return list.filter(function (a) { return !a.premium; });
        return list;
      }

      function runSearch(rawQuery) {
        var query = rawQuery.trim();
        clearBtn.classList.toggle('visible', query.length > 0);

        var items;
        if (!query) {
          items = applyFilter(articles);
          countEl.innerHTML = '<strong>' + items.length + '</strong>件の記事';
        } else {
          var merged = new Map();
          expandQuery(query).forEach(function (v) {
            fuse.search(v).forEach(function (r) {
              var existing = merged.get(r.item.url);
              if (!existing || r.score < existing.score) merged.set(r.item.url, r);
            });
          });
          var matched = Array.from(merged.values())
            .sort(function (a, b) { return a.score - b.score; })
            .map(function (r) { return r.item; });
          items = applyFilter(matched);
          countEl.innerHTML = '<strong>' + items.length + '</strong>件 見つかりました';
        }
        renderResults(items);
      }

      fetch('articles.json')
        .then(function (res) {
          if (!res.ok) throw new Error('fetch failed');
          return res.json();
        })
        .then(function (data) {
          articles = Array.isArray(data) ? data : [];

          fuse = new Fuse(articles, {
            keys: ['title'],
            threshold: 0.1,        // タイポの許容度は厳格寄り(表記揺れは同義語展開で対応)
            distance: 60,
            ignoreLocation: true,  // タイトル内のどこに一致してもよい
            minMatchCharLength: 2,
            includeScore: true
          });

          runSearch('');

          input.addEventListener('input', function () { runSearch(input.value); });

          clearBtn.addEventListener('click', function () {
            input.value = '';
            input.focus();
            runSearch('');
          });

          filterChips.forEach(function (chip) {
            chip.addEventListener('click', function () {
              filterChips.forEach(function (c) { c.classList.remove('active'); });
              chip.classList.add('active');
              currentFilter = chip.dataset.filter;
              runSearch(input.value);
            });
          });
        })
        .catch(function () {
          resultsEl.innerHTML =
            '<div class="search-empty"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
            '記事データを取得できませんでした。<br>時間をおいて再度お試しください。</div>';
          countEl.textContent = '';
        });
    })();
  </script>

</body>
</html>
